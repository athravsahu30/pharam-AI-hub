<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    // Naye imports add kiye gaye hain 👇
    import { getFirestore, doc, setDoc, collection, addDoc, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ... (Aapki firebaseConfig aur initializeApp ka code yahan same rahega) ...

    // 1. Search Save Karne Ka Logic
    const dashSearchBtn = document.getElementById("dashSearchBtn");
    const dashSearchInput = document.getElementById("dashSearchInput");

    async function handleSearch() {
        const searchTerm = dashSearchInput.value.trim();
        if (!searchTerm) return;

        const user = auth.currentUser;
        
        // Agar user logged in hai, toh pehle uski history Firestore mein save karo
        if (user) {
            try {
                await addDoc(collection(db, "search_history"), {
                    uid: user.uid,
                    term: searchTerm,
                    timestamp: serverTimestamp()
                });
            } catch (error) {
                console.error("Error saving search history:", error);
            }
        }
        
        // Save hone ke baad Drug Explorer page par le jao
        window.location.href = `pharmarag.html?q=${encodeURIComponent(searchTerm)}`;
    }

    // Search button aur Enter key dono par chalega
    dashSearchBtn.addEventListener("click", handleSearch);
    dashSearchInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSearch();
    });

    // 2. Search History Fetch aur Display Karne Ka Logic
    async function loadSearchHistory(user) {
        const historyContainer = document.getElementById("historyContainer");
        const historyHeading = document.getElementById("historyHeading");
        historyContainer.innerHTML = ""; // Purani list clear karein

        try {
            // User ki ID ke hisaab se uska data nikalo
            const q = query(collection(db, "search_history"), where("uid", "==", user.uid));
            const querySnapshot = await getDocs(q);
            
            let searches = [];
            querySnapshot.forEach((doc) => {
                searches.push(doc.data());
            });

            // Latest search ko upar rakhne ke liye Time ke hisaab se sort karo
            searches.sort((a, b) => {
                const timeA = a.timestamp ? a.timestamp.toMillis() : 0;
                const timeB = b.timestamp ? b.timestamp.toMillis() : 0;
                return timeB - timeA;
            });

            // Agar history hai, tabhi section dikhao (Top 5 searches)
            if (searches.length > 0) {
                historyHeading.style.display = "flex";
                historyContainer.style.display = "flex";

                searches.slice(0, 5).forEach((data) => {
                    const tag = document.createElement("div");
                    tag.className = "history-tag";
                    tag.innerHTML = `🕒 ${data.term}`;
                    
                    // Tag par click karne se wapas wahi search ho jayegi
                    tag.onclick = () => {
                        window.location.href = `pharmarag.html?q=${encodeURIComponent(data.term)}`;
                    };
                    historyContainer.appendChild(tag);
                });
            }
        } catch (error) {
            console.error("Error loading history: ", error);
        }
    }

    // 3. Auto-Login Observer (Yahan UI update ke sath History bhi load karni hai)
    onAuthStateChanged(auth, (user) => {
        if (user) {
            updateHeaderUI(user);
            saveUserDataToAdmin(user);
            loadSearchHistory(user); // NAYA: Login hote hi history load hogi
            document.getElementById("welcomeModalOverlay").classList.remove("show");
        } else {
            // ... (Aapka logged-out wala same code)
        }
    });

    // ... (Baki purana updateHeaderUI aur saveUserDataToAdmin function same rahega)
</script>
