<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaAI Hub - Drug Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
          --bg: #04060C; --bg-panel: #0A0D16;
          --card: rgba(255,255,255,0.035); --card-border: rgba(88,140,255,0.20); --card-border-strong: rgba(88,140,255,0.45);
          --blue: #4C8DFF; --blue-bright: #7AB0FF; --cyan: #22D3EE;
          --ink: #EAF0FB; --ink-soft: #8C97B3; --red: #FF6B6B; --green: #34D399;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; background: radial-gradient(ellipse 900px 500px at 15% -10%, rgba(76,141,255,0.16), transparent 60%), radial-gradient(ellipse 700px 500px at 100% 10%, rgba(34,211,238,0.08), transparent 55%), var(--bg); color: var(--ink); overflow-x: hidden; width: 100%; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; outline: none; }
        h1, h2, h3 { font-family: 'Space Grotesk', 'Inter', sans-serif; }

        /* Sidebar */
        .sidebar { width: 250px; flex-shrink: 0; display: flex; flex-direction: column; padding: 20px; background: var(--bg-panel); border-right: 1px solid var(--card-border); z-index: 10000; transition: all 0.3s ease; }
        @media (min-width: 901px) { .sidebar.collapsed { width: 0; padding-left: 0; padding-right: 0; border: none; opacity: 0; } }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; min-width: 200px;}
        .brand h2 { color: var(--ink); font-size: 18px; margin: 0; }
        .brand span { color: var(--blue-bright); font-size: 10px; letter-spacing: 0.08em; display: block; }
        .brand-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #04060C; border-radius: 10px; font-weight: 700; flex-shrink: 0;}
        .navigation { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
        .nav-label { font-size: 11px; margin: 10px 0 5px; color: var(--ink-soft); letter-spacing: 0.06em; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-radius: 8px; color: var(--ink-soft); font-size: 14px; transition: 0.2s; white-space: nowrap; font-weight: 500;}
        .nav-icon { width: 18px; text-align: center; }
        .nav-item:hover { background: rgba(76,141,255,0.10); color: var(--ink); }
        .nav-item.active { background: rgba(76,141,255,0.16); color: var(--blue-bright); border: 1px solid var(--card-border-strong); }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; opacity: 0; transition: opacity 0.3s; }
        .sidebar-overlay.show { display: block; opacity: 1; }

        /* Main Content */
        .main-content { flex: 1; padding: 25px 35px; overflow-y: auto; width: 100%; min-width: 0; transition: width 0.3s; display: flex; flex-direction: column;}
        .topbar { display: flex; align-items: center; margin-bottom: 30px; gap: 15px; width: 100%; }
        .breadcrumb { font-size: 12px; margin-bottom: 4px; color: var(--ink-soft); }
        .topbar h1 { color: var(--ink); font-size: 22px; margin: 0; }
        .top-actions { display: flex; align-items: center; gap: 16px; margin-left: auto; }
        .menu-toggle { display: flex; color: var(--ink); font-size: 20px; background: var(--card); border: 1px solid var(--card-border); padding: 8px 12px; border-radius: 8px; align-items: center; justify-content: center; transition: 0.2s; }
        .menu-toggle:hover { background: rgba(76,141,255,0.15); border-color: var(--card-border-strong); }
        
        .profile { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--card-border); padding: 5px 15px 5px 5px; border-radius: 30px; cursor: pointer; transition: 0.2s;}
        .profile:hover { border-color: var(--card-border-strong); background: rgba(76,141,255,0.1); }
        .profile-info { display: flex; flex-direction: column; line-height: 1.2; }
        .profile-info strong { color: var(--ink); font-size: 13px; }
        .profile-info span { font-size: 11px; color: var(--ink-soft); }
        .profile-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #04060C; font-weight: 700; font-size: 13px; }
        .login-btn { background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #04060C; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.2s; cursor: pointer; box-shadow: 0 4px 15px rgba(34,211,238,0.15); white-space: nowrap; }

        /* Search Box */
        .search-wrapper { background: var(--card); border: 1px solid var(--card-border); padding: 30px; border-radius: 16px; margin-bottom: 24px; }
        .search-header h2 { color: var(--ink); font-size: 24px; margin-bottom: 8px; margin-top: 0;}
        .search-header p { color: var(--ink-soft); font-size: 14px; margin-bottom: 20px;}
        .search-box { display: flex; gap: 12px; }
        .search-box input { flex: 1; padding: 16px 20px; border-radius: 12px; border: 1px solid var(--card-border-strong); background: rgba(0,0,0,0.3); color: white; font-size: 15px; outline: none; font-family: inherit; transition: 0.3s; }
        .search-box input:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(34,211,238,0.2); background: rgba(0,0,0,0.5);}
        .search-box button { background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #04060C; padding: 0 25px; border-radius: 12px; font-weight: 700; font-size: 15px; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .search-box button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34,211,238,0.3); }

        /* Loader & Results */
        .result-container { display: none; background: var(--card); border: 1px solid var(--card-border-strong); padding: 30px; border-radius: 16px; margin-top: 24px; line-height: 1.7; font-size: 15px; color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,0.3);}
        .result-container h3 { color: var(--cyan); margin-top: 20px; margin-bottom: 10px; font-size: 18px; border-bottom: 1px solid var(--card-border); padding-bottom: 5px; }
        .result-container h3:first-child { margin-top: 0; }
        .result-container ul { margin-left: 20px; color: var(--ink-soft); }
        .result-container b { color: var(--blue-bright); }
        .error-text { color: var(--red); font-weight: bold; }

        .loader { display: none; margin-top: 24px; padding: 20px; background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; }
        .skeleton-line { height: 20px; border-radius: 6px; margin-bottom: 12px; background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.15) 37%, rgba(255,255,255,0.05) 63%); background-size: 400px 100%; animation: shimmer 1.4s ease-in-out infinite; }
        .skeleton-line.short { width: 60%; }
        .skeleton-line.title { height: 30px; width: 40%; margin-bottom: 20px; }
        @keyframes shimmer { 0% { background-position: -300px 0; } 100% { background-position: 300px 0; } }

        @media (max-width: 900px) {
            .sidebar { position: fixed; left: -280px; top: 0; bottom: 0; height: 100vh; width: 260px; box-shadow: 10px 0 30px rgba(0,0,0,0.7); z-index: 10001;}
            .sidebar.open { left: 0; }
            .main-content { padding: 15px; width: 100vw; overflow-x: hidden;}
            .topbar { flex-wrap: wrap; gap: 10px; margin-bottom: 20px;}
            .breadcrumb { display: none; } 
            .profile-info { display: none; } 
            .search-box { flex-direction: column; }
            .search-box button { padding: 16px; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-icon">⚕️</div>
            <div>
                <h2>PharmaAI</h2>
                <span>HUB</span>
            </div>
        </div>
        <nav class="navigation">
            <div class="nav-label">MAIN MENU</div>
            <a href="index.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
            <a href="#" class="nav-item active"><span class="nav-icon">💊</span> Drug Explorer</a>
            <a href="chat.html" class="nav-item"><span class="nav-icon">📄</span> AI Prescription</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menuBtn">☰</button>
            <div style="margin-left: 10px;">
                <div class="breadcrumb">Modules / Drug Explorer</div>
                <h1>Drug Explorer (RAG)</h1>
            </div>
            <div class="top-actions">
                <button id="googleLoginBtn" class="login-btn">
                    <img src="https://www.google.com/favicon.ico" width="16" alt="G"> Sign in
                </button>
                <div id="userProfile" class="profile" style="display: none;" title="Click to Logout">
                    <img id="userProfilePic" src="" alt="User" class="profile-avatar">
                    <div class="profile-info">
                        <strong id="userNameDisplay">Name</strong>
                        <span>Authenticated</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="search-wrapper">
            <div class="search-header">
                <h2>Explore Medicine Data</h2>
                <p>Search generic medicines to view structured indications, ADRs, and categorized dosage forms.</p>
            </div>
            <div class="search-box">
                <input type="text" id="drugInput" placeholder="e.g. Paracetamol, Amoxicillin...">
                <button id="searchBtn">🔍 Search Drug</button>
            </div>
        </div>

        <!-- Animated Loader -->
        <div class="loader" id="loader">
            <div class="skeleton-line title"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
            <br>
            <div class="skeleton-line title"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
        </div>

        <!-- Result Box -->
        <div class="result-container" id="resultBox"></div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Sidebar Logic
            const menuBtn = document.getElementById("menuBtn");
            const sidebar = document.getElementById("sidebar");
            const sidebarOverlay = document.getElementById("sidebarOverlay");

            if(menuBtn) {
                menuBtn.addEventListener("click", () => {
                    if (window.innerWidth > 900) sidebar.classList.toggle("collapsed");
                    else { sidebar.classList.add("open"); sidebarOverlay.classList.add("show"); }
                });
            }
            if(sidebarOverlay) {
                sidebarOverlay.addEventListener("click", () => {
                    sidebar.classList.remove("open"); sidebarOverlay.classList.remove("show");
                });
            }

            // ========================================================
            // AI DRUG SEARCH LOGIC (Updated to gemini-3.8-flash & AQ Key)
            // ========================================================
            const GEMINI_API_KEY = "AQ.Ab8RN6IlEnngKpkYjran8ud9zckHB0lMyZhhSEWyCVt9dXXcGg"; 

            const searchBtn = document.getElementById("searchBtn");
            const drugInput = document.getElementById("drugInput");
            const loader = document.getElementById("loader");
            const resultBox = document.getElementById("resultBox");

            async function searchDrug() {
                const query = drugInput.value.trim();
                if(!query) {
                    alert("Please enter a medicine name!");
                    return;
                }

                resultBox.style.display = "none";
                loader.style.display = "block";

                const prompt = `You are an expert pharmacist. Provide detailed information for the medicine: "${query}". 
                Strictly format the output in clean HTML. 
                Include the following sections clearly: 
                1. Generic Name & RxNorm match. 
                2. Uses/Indications (use proper commas between diseases, e.g., 'Common cold, Backache'). 
                3. Detailed Side Effects. 
                4. Adverse Drug Reactions (ADR). 
                5. Dosage Forms categorized explicitly for: Child, Adult, and Old People. 
                Use headings (<h3>), bold text (<b>), and bullet points (<ul><li>). 
                Do NOT use markdown like **. Start directly with HTML.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });

                    const data = await response.json();
                    if(!response.ok) throw new Error(data.error?.message || "API Error");
                    
                    let htmlContent = data.candidates[0].content.parts[0].text;
                    htmlContent = htmlContent.replace(/```html/g, '').replace(/```/g, '');

                    loader.style.display = "none";
                    resultBox.innerHTML = htmlContent;
                    resultBox.style.display = "block";
                } catch (error) {
                    loader.style.display = "none";
                    resultBox.innerHTML = `<h3 class="error-text">❌ Error Fetching Data</h3><p>${error.message}</p>`;
                    resultBox.style.display = "block";
                }
            }

            if(searchBtn) searchBtn.addEventListener("click", searchDrug);
            if(drugInput) {
                drugInput.addEventListener("keypress", (e) => {
                    if(e.key === 'Enter') searchDrug();
                });
            }

            // Dashboard se aane wali search read karna
            const urlParams = new URLSearchParams(window.location.search);
            const autoQuery = urlParams.get('q');
            if (autoQuery && drugInput) {
                drugInput.value = autoQuery;
                searchDrug();
            }
        });
    </script>

    <!-- FIREBASE AUTH & LOGOUT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvvCVFdsrIfHOwY9qxg062FtUE34ts_IA",
            authDomain: "pharmaai-hub-142f1.firebaseapp.com",
            projectId: "pharmaai-hub-142f1",
            storageBucket: "pharmaai-hub-142f1.firebasestorage.app",
            messagingSenderId: "665986034172",
            appId: "1:665986034172:web:6752ed83566cd6d015ea79"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.addEventListener("DOMContentLoaded", () => {
            const loginBtn = document.getElementById("googleLoginBtn");
            const userProfile = document.getElementById("userProfile");
            const userNameDisplay = document.getElementById("userNameDisplay");
            const userProfilePic = document.getElementById("userProfilePic");

            if(loginBtn) {
                loginBtn.addEventListener("click", () => {
                    signInWithPopup(auth, provider).catch(err => console.error("Login Error:", err));
                });
            }

            // Logout Logic
            if(userProfile) {
                userProfile.addEventListener("click", () => {
                    if (confirm("Do you want to sign out?")) {
                        signOut(auth).then(() => window.location.reload()).catch(err => console.error(err));
                    }
                });
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    if(loginBtn) loginBtn.style.display = "none"; 
                    if(userProfile) userProfile.style.display = "flex"; 
                    if(userNameDisplay) userNameDisplay.innerText = user.displayName.split(" ")[0]; 
                    if(userProfilePic) userProfilePic.src = user.photoURL;
                } else {
                    if(loginBtn) loginBtn.style.display = "flex";
                    if(userProfile) userProfile.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
