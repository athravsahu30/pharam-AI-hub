<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaAI - Drug Explorer</title>
    <style>
        /* Professional Pharma UI / UX Styling */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e8f0fe; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styling */
        .sidebar { width: 260px; background: linear-gradient(180deg, #0056b3, #004494); color: white; padding: 25px 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 4px 0 15px rgba(0,0,0,0.1); }
        .header-title { font-size: 22px; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .sub-title { font-size: 13px; color: #cce0ff; margin-bottom: 30px; }
        
        /* Main Content Area */
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0, 86, 179, 0.15); border: 1px solid #cce0ff; }
        
        /* Auth Button & Profile Styling */
        .login-btn { background: white; color: #0056b3; border: none; padding: 14px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 15px; width: 100%; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .login-btn:hover { background: #f8fafd; transform: translateY(-2px); }
        
        .user-profile { display: none; align-items: center; gap: 15px; background: rgba(255, 255, 255, 0.15); padding: 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); }
        .user-profile img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid white; }
        .user-details { font-size: 13px; overflow: hidden; }
        .user-details span { font-weight: bold; font-size: 15px; display: block; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .user-details small { color: #cce0ff; }
    </style>
</head>
<body>

    <!-- Sidebar Section -->
    <div class="sidebar">
        <div>
            <div class="header-title">⚕️ PharmaAI Hub</div>
            <div class="sub-title">Advanced Drug Explorer</div>
            
            <!-- Future Navigation Links can go here -->
        </div>

        <!-- Authentication Section -->
        <div id="authSection">
            <!-- Login Button -->
            <button id="googleLoginBtn" class="login-btn">
                <img src="https://www.google.com/favicon.ico" width="18" alt="Google"> Sign in with Google
            </button>
            
            <!-- Logged-in User Profile (Hidden by default) -->
            <div id="userProfile" class="user-profile">
                <img id="userProfilePic" src="" alt="Profile Pic">
                <div class="user-details">
                    <span id="userNameDisplay">Name</span>
                    <small id="userEmailDisplay">Email</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content Section -->
    <div class="content">
        <div class="card">
            <h2 style="color: #0056b3; margin-top: 0;">Drug Explorer (RAG System)</h2>
            <p>Welcome! Please use the sidebar to login. Once logged in, your details will be authenticated.</p>
            <!-- Aapka Drug Search bar aur results is jagah par aayenge -->
        </div>
    </div>

    <!-- ========================================== -->
    <!-- FIREBASE SDKs & AUTHENTICATION LOGIC       -->
    <!-- ========================================== -->
    <script type="module">
        // 1. Importing Firebase Modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 👇👇 YAHAN APNI FIREBASE CONFIGURATION PASTE KARIYE 👇👇
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        // 👆👆 ================================================ 👆👆

        // 2. Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 3. UI Elements ko JavaScript mein pakadna
        const loginBtn = document.getElementById("googleLoginBtn");
        const userProfile = document.getElementById("userProfile");
        const userNameDisplay = document.getElementById("userNameDisplay");
        const userProfilePic = document.getElementById("userProfilePic");
        const userEmailDisplay = document.getElementById("userEmailDisplay");

        // 4. Google Login Button Click Event
        loginBtn.addEventListener("click", () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    updateSidebarUI(user);
                    saveUserDataToAdmin(user);
                })
                .catch((error) => {
                    console.error("Login Failed:", error.message);
                    alert("Login failed! " + error.message);
                });
        });

        // 5. Auto-Login Check (Agar user pehle se logged in hai toh page refresh hone par gayab na ho)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                updateSidebarUI(user);
                saveUserDataToAdmin(user); // Last login time update karne ke liye
            } else {
                // Agar user logged out hai
                loginBtn.style.display = "flex";
                userProfile.style.display = "none";
            }
        });

        // 6. UI Update Function (Naam aur Photo dikhana)
        function updateSidebarUI(user) {
            loginBtn.style.display = "none"; 
            userProfile.style.display = "flex"; 
            
            // "Good afternoon, Name" jaisa feel dene ke liye
            userNameDisplay.innerText = "Hi, " + user.displayName.split(" ")[0]; 
            userEmailDisplay.innerText = user.email;
            userProfilePic.src = user.photoURL;
        }

        // 7. Admin Tracking Function (Firestore Database mein data bhejna)
        async function saveUserDataToAdmin(user) {
            try {
                // "users" naam ke database folder mein user ki ID se file banegi
                const userRef = doc(db, "users", user.uid);
                await setDoc(userRef, {
                    name: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL,
                    lastLoginTime: new Date().toLocaleString("en-IN") // Indian Time
                }, { merge: true }); // Merge se purana data delete nahi hoga
                
                console.log("User Data tracked in Firestore successfully!");
            } catch (error) {
                console.error("Tracking Error:", error);
            }
        }
    </script>
</body>
</html>
