<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prescription Reader</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e8f0fe; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .scanner-container { background: white; width: 100%; max-width: 500px; border-radius: 16px; padding: 25px; box-shadow: 0 8px 24px rgba(0, 86, 179, 0.15); text-align: center; }
        .header { color: #0056b3; margin-bottom: 5px; font-size: 24px; font-weight: bold; }
        .sub-header { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .upload-btn { background: #009688; color: white; padding: 15px 25px; border-radius: 30px; cursor: pointer; display: inline-block; font-weight: bold; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0, 150, 136, 0.3); width: 80%; }
        .upload-btn:hover { background: #00796b; }
        #imageInput { display: none; }
        
        #preview { max-width: 100%; margin-top: 20px; border-radius: 8px; display: none; border: 2px dashed #cce0ff; box-sizing: border-box; }
        
        button.scan-btn { background: #0056b3; color: white; border: none; padding: 15px 25px; border-radius: 30px; margin-top: 20px; cursor: pointer; font-weight: bold; font-size: 16px; display: none; width: 100%; transition: 0.3s; box-shadow: 0 4px 10px rgba(0, 86, 179, 0.3); }
        button.scan-btn:hover { background: #004494; }
        
        .loader { display: none; margin-top: 20px; color: #009688; font-weight: bold; font-size: 16px; }
        #resultBox { margin-top: 20px; padding: 15px; background: #f4f8ff; border-radius: 8px; text-align: left; display: none; border: 1px solid #cce0ff; font-size: 15px; line-height: 1.6; color: #333; overflow-wrap: break-word; }
        .error-msg { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

    <div class="scanner-container">
        <div class="header">📄 Smart Prescription Reader</div>
        <div class="sub-header">Upload or take a photo of a medical prescription</div>
        
        <label class="upload-btn">
            📸 Open Camera / Gallery
            <input type="file" id="imageInput" accept="image/*">
        </label>
        
        <img id="preview" src="" alt="Prescription Preview">
        <button id="scanBtn" class="scan-btn">🔍 Read Prescription</button>
        
        <div id="loader" class="loader">Scanning doctor's handwriting... ⏳</div>
        <div id="resultBox"></div>
    </div>

    <!-- JS YAHIN HTML KE ANDAR HAI -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const imageInput = document.getElementById("imageInput");
            const preview = document.getElementById("preview");
            const scanBtn = document.getElementById("scanBtn");
            const resultBox = document.getElementById("resultBox");
            const loader = document.getElementById("loader");

            // 👇 Aapki exact API key yahan fix kar di gayi hai 👇
            const API_KEY = "AQ.Ab8RN6IlEnngKpkYjran8ud9zckHB0lMyZhhSEWyCVt9dXXcGg"; 

            let base64Image = "";
            let mimeType = "image/jpeg";

            imageInput.addEventListener("change", function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        preview.src = event.target.result;
                        preview.style.display = "block";
                        scanBtn.style.display = "block";
                        resultBox.style.display = "none";
                        
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement("canvas");
                            const ctx = canvas.getContext("2d");
                            const MAX_WIDTH = 800; 
                            const scaleSize = MAX_WIDTH / img.width;
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            base64Image = canvas.toDataURL("image/jpeg", 0.7).split(',')[1];
                        }
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            scanBtn.addEventListener("click", async function() {
                if (!base64Image) {
                    alert("Please wait 2 seconds for image to process and try again.");
                    return;
                }

                scanBtn.style.display = "none"; 
                loader.style.display = "block"; 
                resultBox.style.display = "none";

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Read this medical prescription carefully. Extract Patient details and Medicines with dosages. Format using HTML tags like <br> and <b>. No markdown." },
                                    { inlineData: { mimeType: mimeType, data: base64Image } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();
                    loader.style.display = "none"; 
                    
                    if (!response.ok) {
                        throw new Error(data.error.message || "API Key ya Server mein problem hai.");
                    }

                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        let aiResponse = data.candidates[0].content.parts[0].text;
                        aiResponse = aiResponse.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>'); 
                        resultBox.innerHTML = aiResponse;
                        resultBox.style.display = "block";
                        scanBtn.style.display = "block"; 
                    } else {
                        throw new Error("AI ne koi text nahi diya.");
                    }

                } catch (error) {
                    loader.style.display = "none";
                    resultBox.innerHTML = `<span class="error-msg">❌ Error: ${error.message}</span> <br><br> Apna API Key check karein ya photo clearly wapas khichein.`;
                    resultBox.style.display = "block";
                    scanBtn.style.display = "block";
                }
            });
        });
    </script>
</body>
</html>
