<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prescription Reader</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e8f0fe; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .scanner-container { background: white; width: 100%; max-width: 500px; border-radius: 16px; padding: 25px; box-shadow: 0 8px 24px rgba(0, 86, 179, 0.15); text-align: center; }
        .header { color: #0056b3; margin-bottom: 5px; font-size: 24px; font-weight: bold; }
        .sub-header { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        /* Camera Button Style */
        .upload-btn { background: #009688; color: white; padding: 15px 25px; border-radius: 30px; cursor: pointer; display: inline-block; font-weight: bold; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0, 150, 136, 0.3); }
        .upload-btn:hover { background: #00796b; }
        
        /* Hide default file input */
        #imageInput { display: none; }
        
        /* Image Preview */
        #preview { max-width: 100%; margin-top: 20px; border-radius: 8px; display: none; border: 2px dashed #cce0ff; box-sizing: border-box; }
        
        /* Scan Button */
        button.scan-btn { background: #0056b3; color: white; border: none; padding: 12px 25px; border-radius: 30px; margin-top: 20px; cursor: pointer; font-weight: bold; font-size: 16px; display: none; width: 100%; transition: 0.3s; }
        button.scan-btn:hover { background: #004494; }
        
        /* Loader and Results */
        .loader { display: none; margin-top: 20px; color: #009688; font-weight: bold; font-size: 16px; }
        #resultBox { margin-top: 20px; padding: 15px; background: #f4f8ff; border-radius: 8px; text-align: left; display: none; border: 1px solid #cce0ff; font-size: 15px; line-height: 1.6; color: #333; }
    </style>
</head>
<body>

    <div class="scanner-container">
        <div class="header">📄 Smart Prescription Reader</div>
        <div class="sub-header">Upload or take a photo of a medical prescription</div>
        
        <!-- 'capture="environment"' forces mobile phones to open the back camera -->
        <label class="upload-btn">
            📸 Open Camera / Gallery
            <input type="file" id="imageInput" accept="image/*" capture="environment">
        </label>
        
        <img id="preview" src="" alt="Prescription Preview">
        <button id="scanBtn" class="scan-btn">🔍 Read Prescription</button>
        
        <div id="loader" class="loader">Scanning doctor's handwriting... ⏳</div>
        <div id="resultBox"></div>
    </div>

    <!-- Anti-cache versioning so you see changes instantly -->
    <script src="chat.js?v=scanner-1"></script>
</body>
</html>
