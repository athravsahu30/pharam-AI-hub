<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prescription Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#04060C; --card:rgba(255,255,255,0.035); --card-border:rgba(88,140,255,0.25);
            --blue:#4C8DFF; --cyan:#22D3EE; --ink:#EAF0FB; --ink-soft:#8C97B3; --white-box:#F7F9FC;
        }
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(ellipse 900px 500px at 15% -10%, rgba(76,141,255,0.16), transparent 60%),
                radial-gradient(ellipse 700px 500px at 100% 10%, rgba(34,211,238,0.08), transparent 55%),
                var(--bg);
            display: flex; justify-content: center; padding: 20px; margin: 0; min-height: 100vh;
        }
        .scanner-container {
            background: var(--card); width: 100%; max-width: 500px; border-radius: 18px; padding: 25px;
            border: 1px solid var(--card-border); text-align: center; backdrop-filter: blur(6px);
        }
        .header { font-family: 'Space Grotesk', sans-serif; color: var(--ink); margin-bottom: 5px; font-size: 22px; font-weight: 700; }
        .sub-header { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 25px; }

        .upload-btn {
            background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #04060C; padding: 14px 25px;
            border-radius: 30px; cursor: pointer; display: inline-block; font-weight: 700; font-size: 15px;
            transition: 0.2s; width: 80%; box-shadow: 0 4px 18px rgba(76,141,255,0.3);
        }
        .upload-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(76,141,255,0.45); }
        #imageInput { display: none; }

        #preview { max-width: 100%; margin-top: 20px; border-radius: 12px; display: none; border: 1px solid #D8D2C0; background: var(--white-box); box-sizing: border-box; }

        button.scan-btn {
            background: transparent; color: var(--blue); border: 1px solid var(--card-border);
            padding: 14px 25px; border-radius: 30px; margin-top: 20px; cursor: pointer; font-weight: 700;
            font-size: 15px; display: none; width: 100%; transition: 0.2s;
        }
        button.scan-btn:hover { background: rgba(76,141,255,0.10); }

        .loader { display: none; margin-top: 20px; color: var(--cyan); font-weight: 600; font-size: 14px; }
        #resultBox {
            margin-top: 20px; padding: 16px; background: var(--white-box); border-radius: 12px; text-align: left;
            display: none; font-size: 14.5px; line-height: 1.6; color: #1A1A1A; overflow-wrap: break-word;
        }
        .error-msg { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

    <div class="scanner-container">
        <a href="index.html" style="display:inline-block; margin-bottom:14px; font-size:13px; color:#7AB0FF; text-decoration:none;">← Back to Dashboard</a>
        <div class="header">📄 Smart Prescription Reader</div>
        <div class="sub-header">Upload or take a photo of a medical prescription</div>
        
        <label class="upload-btn">
            📸 Open Camera / Gallery
            <input type="file" id="imageInput" accept="image/*">
        </label>
        
        <img id="preview" src="" alt="Prescription Preview">
        <button id="scanBtn" class="scan-btn">🔍 Read Prescription</button>
        
        <div id="loader" class="loader">Scanning doctor's handwriting... ⏳</div>
        <div id="resultBox"></div>
    </div>

    <!-- Free, on-device OCR — no API key needed -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const imageInput = document.getElementById("imageInput");
            const preview = document.getElementById("preview");
            const scanBtn = document.getElementById("scanBtn");
            const resultBox = document.getElementById("resultBox");
            const loader = document.getElementById("loader");

            let currentFile = null;

            imageInput.addEventListener("change", function(e) {
                const file = e.target.files[0];
                if (file) {
                    currentFile = file;
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        preview.src = event.target.result;
                        preview.style.display = "block";
                        scanBtn.style.display = "block";
                        resultBox.style.display = "none";
                    };
                    reader.readAsDataURL(file);
                }
            });

            scanBtn.addEventListener("click", async function() {
                if (!currentFile) {
                    alert("Please pehle ek photo select karein.");
                    return;
                }

                scanBtn.style.display = "none";
                loader.style.display = "block";
                loader.textContent = "Scanning doctor's handwriting... ⏳ 0%";
                resultBox.style.display = "none";

                try {
                    const result = await Tesseract.recognize(currentFile, 'eng', {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                loader.textContent = "Scanning doctor's handwriting... ⏳ " + Math.round(m.progress * 100) + "%";
                            }
                        }
                    });

                    const text = (result.data.text || "").trim();
                    loader.style.display = "none";

                    if (text) {
                        resultBox.innerHTML = text.replace(/\n/g, "<br>");
                    } else {
                        resultBox.innerHTML = '<span class="error-msg">⚠️ Kuch text detect nahi hua.</span> Sharper, well-lit photo try karein.';
                    }
                    resultBox.style.display = "block";
                    scanBtn.style.display = "block";

                } catch (error) {
                    loader.style.display = "none";
                    resultBox.innerHTML = `<span class="error-msg">❌ Error: text nahi padh paya.</span><br><br>Dobara try karein.`;
                    resultBox.style.display = "block";
                    scanBtn.style.display = "block";
                }
            });
        });
    </script>
</body>
</html>
